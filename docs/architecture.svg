<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1060" role="img" aria-labelledby="title desc">
  <title id="title">Opportunity Tracker architecture</title>
  <desc id="desc">macOS launchd wakes a scheduler every 15 minutes. The scheduler reads task_log.json to decide which of three jobs is due: a scraper run on Tuesday and Friday, deadline alerts daily, and a digest email on Sunday. Scrapers write matched roles to a Notion jobs database, the alert job turns program dates into reminder lines, and an error monitor checks both the logs and task_log.json for failures. All three feed a weekly digest that goes out through Resend.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9a49c"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="1060" fill="#fdfdfc"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- ============ trigger ============ -->
    <rect x="290" y="30" width="340" height="58" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="460" y="56" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">macOS launchd</text>
    <text x="460" y="77" text-anchor="middle" font-size="12.5" fill="#6b6660">run_check_missed_tasks.sh · every 15 min</text>

    <line x1="460" y1="88" x2="460" y2="124" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="470" y="111" font-size="11" fill="#6b6660">wakes</text>

    <!-- ============ scheduler ============ -->
    <rect x="270" y="126" width="380" height="88" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="460" y="153" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">check_missed_tasks.py</text>
    <text x="460" y="176" text-anchor="middle" font-size="12.5" fill="#6b6660">flock guard — overlapping ticks can't double-send</text>
    <text x="460" y="196" text-anchor="middle" font-size="12.5" fill="#6b6660">21-day lookback catches slots missed while asleep</text>

    <rect x="706" y="134" width="150" height="72" rx="8" fill="#f4f2ee" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="781" y="160" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a1a1a">task_log.json</text>
    <text x="781" y="179" text-anchor="middle" font-size="10.5" fill="#6b6660">last success per task</text>
    <text x="781" y="195" text-anchor="middle" font-size="10.5" fill="#6b6660">updated after each run</text>

    <line x1="654" y1="170" x2="702" y2="170" stroke="#a9a49c" stroke-width="1.6"
          marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- ============ fan-out: what is due ============ -->
    <line x1="460" y1="214" x2="460" y2="248" stroke="#b45309" stroke-width="1.6"/>
    <text x="470" y="235" font-size="11" fill="#6b6660">what's due?</text>
    <line x1="184" y1="248" x2="736" y2="248" stroke="#b45309" stroke-width="1.6"/>
    <line x1="184" y1="248" x2="184" y2="286" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
    <line x1="460" y1="248" x2="460" y2="286" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
    <line x1="736" y1="248" x2="736" y2="286" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
    <text x="192" y="272" font-size="12" font-weight="600" fill="#b45309">Tue &amp; Fri 10:00</text>
    <text x="468" y="272" font-size="12" font-weight="600" fill="#b45309">daily 10:00</text>
    <text x="728" y="272" text-anchor="end" font-size="12" font-weight="600" fill="#b45309">Sun 17:00 · Mon catch-up</text>

    <!-- ============ the three jobs ============ -->
    <rect x="64" y="288" width="240" height="62" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="184" y="314" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">run_all.py</text>
    <text x="184" y="335" text-anchor="middle" font-size="12.5" fill="#6b6660">runs the three scrapers in order</text>

    <rect x="340" y="288" width="240" height="62" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="460" y="314" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">countdown_alerts.py</text>
    <text x="460" y="335" text-anchor="middle" font-size="12.5" fill="#6b6660">deadline &amp; opening reminders</text>

    <rect x="616" y="288" width="240" height="62" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="736" y="314" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">newsletter.py</text>
    <text x="736" y="335" text-anchor="middle" font-size="12.5" fill="#6b6660">weekly HTML digest</text>

    <!-- ============ lane A — scrapers ============ -->
    <line x1="184" y1="350" x2="184" y2="392" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="192" y="376" font-size="11" fill="#6b6660">in order</text>

    <rect x="64" y="394" width="240" height="56" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="184" y="418" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1a1a1a">scrape_yc.py</text>
    <text x="184" y="438" text-anchor="middle" font-size="12" fill="#6b6660">YC Work at a Startup · Playwright</text>

    <line x1="184" y1="450" x2="184" y2="466" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="64" y="468" width="240" height="56" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="184" y="492" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1a1a1a">scrape_simplify.py</text>
    <text x="184" y="512" text-anchor="middle" font-size="12" fill="#6b6660">SimplifyJobs README · BeautifulSoup</text>

    <line x1="184" y1="524" x2="184" y2="540" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="64" y="542" width="240" height="56" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="184" y="566" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1a1a1a">scrape_companies.py</text>
    <text x="184" y="586" text-anchor="middle" font-size="12" fill="#6b6660">Greenhouse · Ashby · Workday</text>

    <line x1="184" y1="598" x2="184" y2="642" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="192" y="610" font-size="11" fill="#6b6660">matched roles</text>

    <rect x="64" y="644" width="240" height="60" rx="8" fill="#f4f2ee" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="184" y="670" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">Notion — Jobs DB</text>
    <text x="184" y="690" text-anchor="middle" font-size="12" fill="#6b6660">new rows, de-duped by link</text>

    <!-- ============ lane B — countdown alerts ============ -->
    <line x1="460" y1="350" x2="460" y2="392" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="468" y="376" font-size="11" fill="#6b6660">reads deadlines</text>

    <rect x="340" y="394" width="240" height="56" rx="8" fill="#f4f2ee" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="460" y="418" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">Notion — Programs DB</text>
    <text x="460" y="438" text-anchor="middle" font-size="12" fill="#6b6660">Opens On · Deadline · Alert Days</text>

    <line x1="460" y1="450" x2="460" y2="642" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="468" y="545" font-size="11" fill="#6b6660">each date that comes due</text>

    <rect x="340" y="644" width="240" height="60" rx="8" fill="#f4f2ee" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="460" y="670" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">alert_log.txt</text>
    <text x="460" y="690" text-anchor="middle" font-size="12" fill="#6b6660">one line per alert fired</text>

    <!-- same-day reminder mail: leaves the pipeline early, sent immediately -->
    <polyline points="460,630 32,630 32,846 364,846 364,864" fill="none" stroke="#a9a49c" stroke-width="1.6"
              stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="452" y="620" text-anchor="end" font-size="11" fill="#6b6660">also emailed the same day</text>

    <!-- ============ lane C — health ============ -->
    <line x1="736" y1="350" x2="736" y2="392" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="744" y="376" font-size="11" fill="#6b6660">asks for a health block</text>

    <rect x="616" y="394" width="240" height="72" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="736" y="419" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">error_monitor.py</text>
    <text x="736" y="439" text-anchor="middle" font-size="12" fill="#6b6660">scans scraper.log + logs/*.log</text>
    <text x="736" y="457" text-anchor="middle" font-size="12" fill="#6b6660">and task_log.json for silence</text>

    <!-- the non-obvious edge: a task that dies quietly logs nothing, so only task_log betrays it -->
    <polyline points="856,170 896,170 896,430 860,430" fill="none" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="876" y="300" text-anchor="middle" font-size="10" fill="#6b6660" transform="rotate(-90 876 300)">tasks that stopped running</text>

    <polyline points="736,466 736,720 550,720 550,754" fill="none" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="744" y="600" font-size="11" fill="#6b6660">system health block</text>

    <!-- ============ digest and send ============ -->
    <polyline points="184,704 184,730 370,730 370,754" fill="none" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="192" y="722" font-size="11" fill="#6b6660">new roles since last digest</text>

    <line x1="460" y1="704" x2="460" y2="754" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="468" y="734" font-size="11" fill="#6b6660">reminder lines</text>

    <rect x="310" y="756" width="300" height="68" rx="8" fill="#f4f2ee" stroke="#c9c5be" stroke-width="1.5"/>
    <text x="460" y="784" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">Weekly digest email</text>
    <text x="460" y="806" text-anchor="middle" font-size="12.5" fill="#6b6660">new roles · reminders · system health</text>

    <line x1="460" y1="824" x2="460" y2="864" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="290" y="868" width="340" height="62" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="460" y="896" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">emailer.py</text>
    <text x="460" y="917" text-anchor="middle" font-size="12.5" fill="#6b6660">one POST to the Resend API</text>

    <line x1="460" y1="930" x2="460" y2="966" stroke="#a9a49c" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="340" y="968" width="240" height="58" rx="8" fill="#f4f2ee" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="460" y="995" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">your inbox</text>
    <text x="460" y="1015" text-anchor="middle" font-size="12" fill="#6b6660">ALERT_EMAIL</text>

    <!-- ============ legend ============ -->
    <rect x="64" y="962" width="18" height="13" rx="3" fill="#ffffff" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="90" y="973" font-size="10.5" fill="#6b6660">script</text>
    <rect x="64" y="982" width="18" height="13" rx="3" fill="#f4f2ee" stroke="#d9d6d0" stroke-width="1.25"/>
    <text x="90" y="993" font-size="10.5" fill="#6b6660">stored data</text>
    <line x1="64" y1="1008" x2="82" y2="1008" stroke="#a9a49c" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="90" y="1012" font-size="10.5" fill="#6b6660">sent immediately</text>
    <text x="64" y="1040" font-size="10.5" fill="#a9a49c">scripts live in automation/ and scrapers/</text>

  </g>
</svg>
